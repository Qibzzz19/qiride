<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Qiride — catat servis motor dalam hitungan detik. OCR spedometer AI, logbook foto, setup aktif, dan prediksi perawatan berdasarkan KM."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Qiride" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Qiride — Smart Motorcycle Care</title>
    <style>
      :root {
        background: #0b0f19;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0f19;
      }
      body {
        font-family:
          'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      #root:empty + .boot-screen {
        display: flex;
      }
      .boot-screen {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 5;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 22px;
        background:
          radial-gradient(60% 40% at 50% 0%, rgba(37, 99, 235, 0.24), transparent 70%),
          #0b0f19;
        color: #f8fafc;
      }
      .boot-logo {
        width: 76px;
        height: 76px;
        border-radius: 24px;
        box-shadow:
          0 24px 70px -18px rgba(37, 99, 235, 0.8),
          0 0 0 1px rgba(59, 130, 246, 0.25);
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      .boot-word {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.26em;
        text-transform: uppercase;
      }
      .boot-word span {
        color: #22d3ee;
      }
      .boot-track {
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(148, 163, 184, 0.14);
      }
      .boot-track::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #06b6d4, #3b82f6);
        animation: boot-load 1.4s ease-in-out infinite;
      }
      @keyframes boot-load {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(330%);
        }
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-3px) scale(1.025);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo,
        .boot-track::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="boot-screen" aria-hidden="true">
      <img class="boot-logo" src="/icons/icon-192.png" alt="" width="76" height="76" />
      <div class="boot-word">Qiri<span>de</span></div>
      <div class="boot-track"></div>
    </div>
    <noscript>
      <div style="padding: 32px; color: #f8fafc; font-family: sans-serif">
        Qiride membutuhkan JavaScript untuk berjalan. Aktifkan JavaScript lalu muat ulang halaman.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
